api: Nittei Scheduler API
format: text
media_type: text/html; charset=utf-8
rfc9457: false
envelope: >-
  There is no JSON error envelope. NitteiError::error_response() returns the status code,
  a literal Content-Type of "text/html; charset=utf-8", and the Display string of the
  variant as the raw body. Clients must key on the HTTP status code, not on a parsed body.
note: >-
  This is a real interoperability gap worth stating plainly: an agent or SDK cannot
  machine-read a Nittei error. There is no type URI, no code field, and no structured
  detail — only a human sentence served as text/html.
