  ratelimit_headers: []
  retry_after: false
  note: No X-RateLimit-*, RateLimit-* or Retry-After header is emitted or documented.
exhaustion_status: null
client_backoff:
  note: >-
    The published JavaScript client has a retry policy but it is a *connection-failure*
    policy, not a rate-limit policy: exponential backoff (immediate, 1s, 2s, 4s, capped),
    maxRetries default 3, on GET/PUT/DELETE only, triggered by ECONNRESET, ETIMEDOUT,
    ENOTFOUND, ENETUNREACH and 5xx. 429 is not in the trigger list.
  source: https://github.com/meetsmore/nittei/blob/master/examples/retry-mechanism.md
upstream_limits:
  api: use-ai Server
  note: >-
    use-ai surfaces the model provider's limits rather than its own — the client maps
    HTTP 429 to a rate-limit error code and HTTP 529 to a provider-overloaded error code.
    These originate at Anthropic/OpenAI, not at MeetsMore. A payload ceiling is
    configurable via MAX_HTTP_BUFFER_SIZE (default 10485760 bytes).
