limit_count: 0
note: >-
  An honest zero. Nittei documents no rate limit and implements none: the Axum middleware
  stack in crates/api/src/lib.rs is CORS, decompression, compression, sensitive-header
  redaction, panic catching and tracing — there is no throttling layer, and NitteiError has
  no 429 variant, so the API cannot return one. That is coherent for a self-hosted server:
  the limit is whatever the operator's own ingress imposes. Nothing is recorded for the
  MeetsMore marketplace because it publishes no API at all.
limits: []
