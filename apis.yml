- name: use-ai Server
  description: >-
    use-ai is MeetsMore's open-source (BUSL-1.1) React client and Node/Bun server for
    letting an LLM drive a web application's own frontend. The server partially implements
    the AG-UI protocol over Socket.IO, exposes the browser-side tools a React app declares
    to the model as MCP tools, and can federate additional remote MCP endpoints declared
    through MCP_ENDPOINT_* environment variables. It ships as four npm packages
    (@meetsmore-oss/use-ai-client, -core, -server, -plugin-workflows) and a container image
    at ghcr.io/meetsmore/use-ai-server; the documented default listen port is 8081. Like
    Nittei it is self-hosted — MeetsMore operates no public instance.
  humanURL: https://github.com/meetsmore/use-ai
  baseURL: http://{use-ai-server-host}:8081
