apis:
- name: Nittei Scheduler API
  description: >-
    Nittei is MeetsMore's self-hosted calendar and scheduler server, written in Rust
    (Axum + SQLx + PostgreSQL) and published under the MIT licence. It exposes a
    multi-tenant REST API under /api/v1 covering Accounts, Users, Calendars, Calendar
    Events (with RRULE recurrence), Schedules, Services (bookable resources and booking
    slots), Reminders and Status, plus Google Calendar and Outlook Calendar sync. The
    server generates its own OpenAPI document at runtime with utoipa and serves it at
    /api-docs/openapi.json behind a Swagger UI at /swagger-ui. Because Nittei is
    distributed as source, a container image and a Helm chart rather than as a hosted
    service, the host in baseURL is a deployment variable — MeetsMore publishes no public
    instance, so the generated OpenAPI document cannot be fetched anonymously.
  humanURL: https://github.com/meetsmore/nittei
  baseURL: https://{nittei-host}/api/v1
  tags:
  - Scheduling
  - Calendar
  - Booking
  - Open-Source
  - Self-Hosted
  tags_raw:
