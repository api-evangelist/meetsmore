aid: meetsmore
name: MeetsMore
description: >-
  MeetsMore Inc. (株式会社ミツモア) operates Japan's largest local-services marketplace,
  matching consumers and businesses with vetted professionals across 600+ categories —
  house cleaning, appliance installation, moving, renovation, pest control, photography,
  tax accountants and administrative scriveners — alongside ProOne, a cloud operations
  system for short-term construction contractors, and Hatchoo, an enterprise procurement
  platform built on the same contractor network. Founded February 2017 and headquartered
  in Ginza, Tokyo, the company reports 77,000+ registered service providers and passed a
  cumulative five million service requests in 2024. MeetsMore runs no public developer
  program for the marketplace itself and its production backend (api.meetsmore.com) is a
  closed AWS API Gateway; its public API surface is instead two first-party open-source
  products published from its own GitHub organization — Nittei, a self-hosted Rust
  calendar/scheduler API server with a utoipa-generated OpenAPI document, and use-ai, an
  AG-UI/MCP React framework distributed as four npm packages.
